<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Courses</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;

      /* Background behind DotGrid */
      background: #080014;
      color: white;
    }

    /* =================================
       DOT GRID BACKGROUND
    ================================= */

    .dot-grid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(82, 39, 255, 0.12),
          transparent 45%
        ),
        #080014;
    }

    #dotCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Purple glow */
    .glow {
      position: fixed;
      width: 700px;
      height: 700px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: radial-gradient(
        circle,
        rgba(82, 39, 255, 0.22) 0%,
        rgba(82, 39, 255, 0.08) 40%,
        transparent 70%
      );

      filter: blur(50px);

      pointer-events: none;

      z-index: 1;
    }

    /* =================================
       DARK OVERLAY
    ================================= */

    .overlay {
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          transparent 10%,
          rgba(0, 0, 0, 0.15) 70%,
          rgba(0, 0, 0, 0.35) 100%
        );

      pointer-events: none;

      z-index: 2;
    }

    /* =================================
       LOGIN
    ================================= */

    .container {
      position: relative;
      z-index: 10;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      padding: 45px 40px;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

      text-align: center;

      color: white;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;

      margin-bottom: 10px;

      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 16px;

      opacity: 0.7;

      margin-bottom: 30px;
    }

    /* =================================
       INPUT
    ================================= */

    input {
      width: 100%;

      padding: 15px 18px;

      border-radius: 12px;

      border: 1px solid rgba(255, 255, 255, 0.18);

      background: rgba(255, 255, 255, 0.08);

      color: white;

      font-size: 16px;

      outline: none;

      margin-bottom: 15px;

      transition: 0.25s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      border-color: #8d6cff;

      background: rgba(255, 255, 255, 0.12);

      box-shadow:
        0 0 0 3px rgba(82, 39, 255, 0.15);
    }

    /* =================================
       BUTTON
    ================================= */

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #ffffff;

      color: #5227ff;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 30px rgba(82, 39, 255, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    /* =================================
       ERROR
    ================================= */

    .error {
      margin-top: 15px;

      color: #ffb9f5;

      font-size: 14px;

      display: none;
    }

    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .login-box {
        padding: 35px 25px;
      }

      h1 {
        font-size: 28px;
      }

      .logo {
        font-size: 45px;
      }
    }

  </style>
</head>

<body>

  <!-- DOT GRID -->
  <div class="dot-grid">
    <canvas id="dotCanvas"></canvas>
  </div>

  <!-- Glow behind login -->
  <div class="glow"></div>

  <!-- Dark overlay -->
  <div class="overlay"></div>


  <!-- LOGIN -->
  <main class="container">

    <div class="login-box">

      <div class="logo">🇬🇧</div>

      <h1>English Courses</h1>

      <p class="subtitle">
        Your online learning space
      </p>


      <input
        type="password"
        id="password"
        placeholder="Enter your class password"
        autocomplete="off"
      >


      <button onclick="checkPassword()">
        Access my courses →
      </button>


      <p id="error" class="error">
        Incorrect password. Please try again.
      </p>

    </div>

  </main>


  <script>

    /* =================================
       LOGIN
    ================================= */

    function checkPassword() {

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      /*
        CHANGE PASSWORD HERE
      */

      const correctPassword = "ENGLISH2026";


      if (password === correctPassword) {

        window.location.href = "classes.html";

      } else {

        error.style.display = "block";

      }

    }


    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          checkPassword();

        }

      });



    /* =================================
       DOT GRID
       Inspired by React Bits DotGrid
    ================================= */

    const canvas =
      document.getElementById("dotCanvas");

    const ctx =
      canvas.getContext("2d");


    /*
      SETTINGS
    */

    const dotSize = 3;

    const gap = 28;

    const proximity = 150;

    const shockRadius = 220;

    const shockStrength = 12;


    /*
      Colors
    */

    const baseColor = {
      r: 82,
      g: 39,
      b: 255
    };

    const activeColor = {
      r: 255,
      g: 159,
      b: 252
    };


    let dots = [];

    let width = 0;

    let height = 0;


    const pointer = {

      x: -1000,
      y: -1000,

      lastX: 0,
      lastY: 0,

      speed: 0

    };


    /* =================================
       CREATE GRID
    ================================= */

    function buildGrid() {

      const dpr =
        window.devicePixelRatio || 1;


      width =
        window.innerWidth;

      height =
        window.innerHeight;


      canvas.width =
        width * dpr;

      canvas.height =
        height * dpr;


      canvas.style.width =
        width + "px";

      canvas.style.height =
        height + "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      dots = [];


      const cell =
        dotSize + gap;


      const cols =
        Math.ceil(width / cell) + 2;

      const rows =
        Math.ceil(height / cell) + 2;


      for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

          dots.push({

            x:
              x * cell,

            y:
              y * cell,

            offsetX: 0,

            offsetY: 0,

            velocityX: 0,

            velocityY: 0

          });

        }

      }

    }


    /* =================================
       MOUSE
    ================================= */

    document.addEventListener(
      "mousemove",
      function(event) {

        const dx =
          event.clientX -
          pointer.lastX;

        const dy =
          event.clientY -
          pointer.lastY;


        pointer.speed =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        pointer.x =
          event.clientX;

        pointer.y =
          event.clientY;


        pointer.lastX =
          event.clientX;

        pointer.lastY =
          event.clientY;


        /*
          Push dots when mouse
          moves quickly
        */

        if (pointer.speed > 5) {

          dots.forEach(dot => {

            const dx =
              dot.x -
              pointer.x;

            const dy =
              dot.y -
              pointer.y;


            const distance =
              Math.sqrt(
                dx * dx +
                dy * dy
              );


            if (
              distance <
              proximity
            ) {

              const force =
                (1 -
                  distance /
                  proximity) *
                pointer.speed *
                0.10;


              const angle =
                Math.atan2(
                  dy,
                  dx
                );


              dot.velocityX +=
                Math.cos(angle) *
                force;


              dot.velocityY +=
                Math.sin(angle) *
                force;

            }

          });

        }

      }
    );


    /*
      Remove highlight when cursor
      leaves window
    */

    document.addEventListener(
      "mouseleave",
      function() {

        pointer.x =
          -1000;

        pointer.y =
          -1000;

      }
    );


    /* =================================
       CLICK SHOCKWAVE
    ================================= */

    document.addEventListener(
      "click",
      function(event) {

        /*
          Don't create huge shockwave
          when clicking the login box
        */

        if (
          event.target.closest(
            ".login-box"
          )
        ) {

          return;

        }


        const clickX =
          event.clientX;

        const clickY =
          event.clientY;


        dots.forEach(dot => {

          const dx =
            dot.x -
            clickX;

          const dy =
            dot.y -
            clickY;


          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          if (
            distance <
            shockRadius
          ) {

            const force =
              (1 -
                distance /
                shockRadius) *
              shockStrength;


            const angle =
              Math.atan2(
                dy,
                dx
              );


            dot.velocityX +=
              Math.cos(angle) *
              force;


            dot.velocityY +=
              Math.sin(angle) *
              force;

          }

        });

      }
    );


    /* =================================
       ANIMATION
    ================================= */

    function animate() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      dots.forEach(dot => {

        /*
          Physics
        */

        dot.offsetX +=
          dot.velocityX;

        dot.offsetY +=
          dot.velocityY;


        /*
          Spring back
        */

        dot.velocityX +=
          -dot.offsetX *
          0.025;

        dot.velocityY +=
          -dot.offsetY *
          0.025;


        /*
          Resistance
        */

        dot.velocityX *=
          0.90;

        dot.velocityY *=
          0.90;


        /*
          Distance from cursor
        */

        const dx =
          dot.x -
          pointer.x;

        const dy =
          dot.y -
          pointer.y;


        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        let r =
          baseColor.r;

        let g =
          baseColor.g;

        let b =
          baseColor.b;


        let size =
          dotSize;


        /*
          Cursor proximity
        */

        if (
          distance <
          proximity
        ) {

          const intensity =
            1 -
            distance /
            proximity;


          r =
            Math.round(
              baseColor.r +
              (
                activeColor.r -
                baseColor.r
              ) *
              intensity
            );


          g =
            Math.round(
              baseColor.g +
              (
                activeColor.g -
                baseColor.g
              ) *
              intensity
            );


          b =
            Math.round(
              baseColor.b +
              (
                activeColor.b -
                baseColor.b
              ) *
              intensity
            );


          size =
            dotSize +
            intensity *
            3;

        }


        ctx.beginPath();


        ctx.arc(

          dot.x +
            dot.offsetX,

          dot.y +
            dot.offsetY,

          size,

          0,

          Math.PI * 2

        );


        ctx.fillStyle =
          `rgb(${r}, ${g}, ${b})`;


        ctx.fill();

      });


      requestAnimationFrame(
        animate
      );

    }


    /* =================================
       RESIZE
    ================================= */

    window.addEventListener(
      "resize",
      buildGrid
    );


    /*
      START
    */

    buildGrid();

    animate();

  </script>

</body>
</html>
