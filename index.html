<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Courses</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;

      overflow: hidden;

      background: #f7f9fc;

      color: #0a2a66;
    }


    /* =========================================
       LIGHT DOT GRID BACKGROUND
    ========================================= */

    .dot-grid {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 0;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(200, 16, 46, 0.05),
          transparent 35%
        ),

        radial-gradient(
          circle at 20% 20%,
          rgba(10, 42, 102, 0.06),
          transparent 30%
        ),

        #f7f9fc;
    }


    #dotCanvas {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }


    /* =========================================
       SOFT BRITISH GLOW
    ========================================= */

    .glow-blue {
      position: fixed;

      width: 650px;
      height: 650px;

      left: -250px;
      top: -250px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(10, 42, 102, 0.10),
          transparent 70%
        );

      filter: blur(30px);

      pointer-events: none;

      z-index: 1;
    }


    .glow-red {
      position: fixed;

      width: 550px;
      height: 550px;

      right: -200px;
      bottom: -200px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(200, 16, 46, 0.09),
          transparent 70%
        );

      filter: blur(35px);

      pointer-events: none;

      z-index: 1;
    }


    /* =========================================
       SUBTLE FLAG LINES
    ========================================= */

    .british-lines {
      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 1;

      opacity: 0.035;

      background:

        linear-gradient(
          32deg,
          transparent 47%,
          #c8102e 48%,
          #c8102e 52%,
          transparent 53%
        ),

        linear-gradient(
          -32deg,
          transparent 47%,
          #0a2a66 48%,
          #0a2a66 52%,
          transparent 53%
        );
    }


    /* =========================================
       GLASS LOGIN CARD
    ========================================= */

    .container {
      position: relative;

      z-index: 10;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    .login-box {
      position: relative;

      width: 100%;

      max-width: 420px;

      padding: 45px 40px;

      border-radius: 24px;

      /*
        Light glass effect
      */

      background:
        rgba(255, 255, 255, 0.78);

      border:
        1px solid rgba(10, 42, 102, 0.10);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:

        0 25px 70px
        rgba(10, 42, 102, 0.12),

        0 5px 20px
        rgba(10, 42, 102, 0.05),

        inset 0 1px 0
        rgba(255, 255, 255, 0.9);

      text-align: center;

      color: #0a2a66;
    }


    /* =========================================
       SMALL RED LINE ON CARD
    ========================================= */

    .login-box::before {
      content: "";

      position: absolute;

      top: 0;
      left: 50%;

      transform: translateX(-50%);

      width: 70px;
      height: 4px;

      border-radius:
        0 0 10px 10px;

      background: #c8102e;
    }


    /* =========================================
       LOGO
    ========================================= */

    .logo {
      font-size: 52px;

      margin-bottom: 15px;

      filter:
        drop-shadow(
          0 4px 8px
          rgba(10, 42, 102, 0.12)
        );
    }


    /* =========================================
       TITLE
    ========================================= */

    h1 {
      font-size: 34px;

      margin-bottom: 10px;

      letter-spacing: -1px;

      color: #0a2a66;
    }


    .subtitle {
      font-size: 16px;

      color: #506080;

      margin-bottom: 30px;
    }


    /* =========================================
       INPUT
    ========================================= */

    input {
      width: 100%;

      padding: 15px 18px;

      border-radius: 12px;

      border:
        1px solid
        rgba(10, 42, 102, 0.15);

      background:
        rgba(247, 249, 252, 0.9);

      color: #0a2a66;

      font-size: 16px;

      outline: none;

      margin-bottom: 15px;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }


    input::placeholder {
      color:
        rgba(10, 42, 102, 0.45);
    }


    input:focus {
      border-color: #0a2a66;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(10, 42, 102, 0.08);
    }


    /* =========================================
       BUTTON
    ========================================= */

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #c8102e;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }


    button:hover {
      transform:
        translateY(-2px);

      background:
        #a90d27;

      box-shadow:
        0 10px 25px
        rgba(200, 16, 46, 0.25);
    }


    button:active {
      transform:
        translateY(0);
    }


    /* =========================================
       ERROR
    ========================================= */

    .error {
      margin-top: 15px;

      color: #c8102e;

      font-size: 14px;

      display: none;
    }


    /* =========================================
       SMALL FOOTER
    ========================================= */

    .footer-text {
      margin-top: 25px;

      font-size: 12px;

      color:
        rgba(10, 42, 102, 0.45);
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .login-box {
        padding:
          35px 25px;
      }


      h1 {
        font-size: 28px;
      }


      .logo {
        font-size: 45px;
      }

    }

  </style>
</head>


<body>


  <!-- ========================================
       DOT GRID
  ========================================= -->

  <div class="dot-grid">

    <canvas id="dotCanvas"></canvas>

  </div>


  <!-- Soft background effects -->

  <div class="glow-blue"></div>

  <div class="glow-red"></div>

  <div class="british-lines"></div>


  <!-- ========================================
       LOGIN
  ======================================== -->

  <main class="container">

    <div class="login-box">


      <div class="logo">
        🇬🇧
      </div>


      <h1>
        English Courses
      </h1>


      <p class="subtitle">
        Your online learning space
      </p>


      <input
        type="password"
        id="password"
        placeholder="Enter your class password"
        autocomplete="off"
      >


      <button
        onclick="checkPassword()"
      >
        Access my courses →
      </button>


      <p
        id="error"
        class="error"
      >
        Incorrect password. Please try again.
      </p>


      <p class="footer-text">
        Learn • Practice • Improve
      </p>


    </div>

  </main>



  <!-- ========================================
       JAVASCRIPT
  ======================================== -->

  <script>


    /* =========================================
       PASSWORD
    ========================================= */

    function checkPassword() {

      const password =
        document.getElementById(
          "password"
        ).value;


      const error =
        document.getElementById(
          "error"
        );


      /*
        CHANGE YOUR PASSWORD HERE
      */

      const correctPassword =
        "ENGLISH2026";


      if (
        password ===
        correctPassword
      ) {

        window.location.href =
          "classes.html";

      }

      else {

        error.style.display =
          "block";

      }

    }



    /* =========================================
       ENTER KEY
    ========================================= */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            checkPassword();

          }

        }
      );



    /* =========================================
       DOT GRID
    ========================================= */

    const canvas =
      document.getElementById(
        "dotCanvas"
      );


    const ctx =
      canvas.getContext("2d");


    /*
      DOT SETTINGS
    */

    const dotSize = 3;

    const gap = 30;

    const proximity = 160;

    const shockRadius = 230;

    const shockStrength = 12;


    /*
      COLORS

      Navy = British blue
      Red  = British red
    */

    const baseColor = {

      r: 10,
      g: 42,
      b: 102

    };


    const activeColor = {

      r: 200,
      g: 16,
      b: 46

    };


    let dots = [];

    let width = 0;

    let height = 0;


    /*
      Mouse
    */

    const pointer = {

      x: -1000,

      y: -1000,

      lastX: 0,

      lastY: 0,

      speed: 0

    };



    /* =========================================
       BUILD GRID
    ========================================= */

    function buildGrid() {

      const dpr =
        window.devicePixelRatio ||
        1;


      width =
        window.innerWidth;


      height =
        window.innerHeight;


      canvas.width =
        width * dpr;


      canvas.height =
        height * dpr;


      canvas.style.width =
        width + "px";


      canvas.style.height =
        height + "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );


      dots = [];


      const cell =
        dotSize + gap;


      const cols =
        Math.ceil(
          width / cell
        ) + 2;


      const rows =
        Math.ceil(
          height / cell
        ) + 2;


      /*
        Center the grid
      */

      const totalWidth =
        cols * cell;


      const totalHeight =
        rows * cell;


      const startX =
        (width -
          totalWidth) /
        2;


      const startY =
        (height -
          totalHeight) /
        2;


      for (
        let y = 0;
        y < rows;
        y++
      ) {

        for (
          let x = 0;
          x < cols;
          x++
        ) {

          dots.push({

            x:
              startX +
              x * cell,

            y:
              startY +
              y * cell,

            offsetX: 0,

            offsetY: 0,

            velocityX: 0,

            velocityY: 0

          });

        }

      }

    }



    /* =========================================
       MOUSE MOVEMENT
    ========================================= */

    document.addEventListener(
      "mousemove",
      function(event) {


        const dx =
          event.clientX -
          pointer.lastX;


        const dy =
          event.clientY -
          pointer.lastY;


        pointer.speed =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        pointer.x =
          event.clientX;


        pointer.y =
          event.clientY;


        pointer.lastX =
          event.clientX;


        pointer.lastY =
          event.clientY;


        /*
          Push nearby dots
        */

        if (
          pointer.speed > 4
        ) {

          dots.forEach(
            dot => {


              const dx =
                dot.x -
                pointer.x;


              const dy =
                dot.y -
                pointer.y;


              const distance =
                Math.sqrt(
                  dx * dx +
                  dy * dy
                );


              if (
                distance <
                proximity
              ) {


                const force =
                  (
                    1 -
                    distance /
                    proximity
                  ) *
                  pointer.speed *
                  0.08;


                const angle =
                  Math.atan2(
                    dy,
                    dx
                  );


                dot.velocityX +=
                  Math.cos(
                    angle
                  ) *
                  force;


                dot.velocityY +=
                  Math.sin(
                    angle
                  ) *
                  force;

              }

            }
          );

        }

      }
    );



    /* =========================================
       MOUSE LEAVE
    ========================================= */

    document.addEventListener(
      "mouseleave",
      function() {

        pointer.x =
          -1000;

        pointer.y =
          -1000;

      }
    );



    /* =========================================
       CLICK SHOCKWAVE
    ========================================= */

    document.addEventListener(
      "click",
      function(event) {


        /*
          Don't trigger the
          effect inside the login
        */

        if (
          event.target.closest(
            ".login-box"
          )
        ) {

          return;

        }


        const clickX =
          event.clientX;


        const clickY =
          event.clientY;


        dots.forEach(
          dot => {


            const dx =
              dot.x -
              clickX;


            const dy =
              dot.y -
              clickY;


            const distance =
              Math.sqrt(
                dx * dx +
                dy * dy
              );


            if (
              distance <
              shockRadius
            ) {


              const force =
                (
                  1 -
                  distance /
                  shockRadius
                ) *
                shockStrength;


              const angle =
                Math.atan2(
                  dy,
                  dx
                );


              dot.velocityX +=
                Math.cos(
                  angle
                ) *
                force;


              dot.velocityY +=
                Math.sin(
                  angle
                ) *
                force;

            }

          }
        );

      }
    );



    /* =========================================
       ANIMATION
    ========================================= */

    function animate() {


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      dots.forEach(
        dot => {


          /*
            Movement
          */

          dot.offsetX +=
            dot.velocityX;


          dot.offsetY +=
            dot.velocityY;


          /*
            Spring
          */

          dot.velocityX +=
            -dot.offsetX *
            0.025;


          dot.velocityY +=
            -dot.offsetY *
            0.025;


          /*
            Resistance
          */

          dot.velocityX *=
            0.90;


          dot.velocityY *=
            0.90;


          /*
            Distance from mouse
          */

          const dx =
            dot.x -
            pointer.x;


          const dy =
            dot.y -
            pointer.y;


          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          /*
            Default navy
          */

          let r =
            baseColor.r;


          let g =
            baseColor.g;


          let b =
            baseColor.b;


          let size =
            dotSize;


          /*
            Mouse interaction
          */

          if (
            distance <
            proximity
          ) {


            const intensity =
              1 -
              distance /
              proximity;


            /*
              Navy → Red
            */

            r =
              Math.round(
                baseColor.r +
                (
                  activeColor.r -
                  baseColor.r
                ) *
                intensity
              );


            g =
              Math.round(
                baseColor.g +
                (
                  activeColor.g -
                  baseColor.g
                ) *
                intensity
              );


            b =
              Math.round(
                baseColor.b +
                (
                  activeColor.b -
                  baseColor.b
                ) *
                intensity
              );


            size =
              dotSize +
              intensity * 3;

          }


          /*
            Draw dot
          */

          ctx.beginPath();


          ctx.arc(

            dot.x +
              dot.offsetX,

            dot.y +
              dot.offsetY,

            size,

            0,

            Math.PI * 2

          );


          ctx.fillStyle =
            `rgb(
              ${r},
              ${g},
              ${b}
            )`;


          ctx.fill();

        }
      );


      requestAnimationFrame(
        animate
      );

    }



    /* =========================================
       RESIZE
    ========================================= */

    window.addEventListener(
      "resize",
      buildGrid
    );



    /* =========================================
       START
    ========================================= */

    buildGrid();

    animate();


  </script>

</body>
</html>
