<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Courses</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 35px;
        }

        .login-box {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        #error {
            color: #dc2626;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>English Courses</h1>
            <p>Your online learning space</p>
        </header>

        <div class="login-box">
            <h2>Welcome 👋</h2>

            <p style="margin-bottom: 20px;">
                Enter your class password to access your courses.
            </p>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button onclick="login()">
                Access my courses
            </button>

            <p id="error">
                Incorrect password. Please try again.
            </p>
        </div>

    </div>

    <script>
        function login() {

            const password = document.getElementById("password").value;

            if (password === "ENGLISH2026") {

                window.location.href = "classes.html";

            } else {

                document.getElementById("error").style.display = "block";

            }
        }
    </script>

</body>
</html>
