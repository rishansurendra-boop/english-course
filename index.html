<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Courses</title>

  <style>
    /* ==============================
       RESET
    ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ==============================
       PAGE
    ============================== */

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #080014;
    }

    /* ==============================
       ANIMATED BACKGROUND
    ============================== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 30%,
          rgba(82, 39, 255, 0.9),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(255, 159, 252, 0.8),
          transparent 35%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.35),
          transparent 30%
        ),
        #080014;
    }

    /* ==============================
       BACKGROUND BLOBS
    ============================== */

    .blob {
      position: absolute;

      width: 65vw;
      height: 65vw;

      max-width: 900px;
      max-height: 900px;

      border-radius: 45% 55% 60% 40%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #ff9ffc 12%,
          #8d6cff 35%,
          #5227ff 60%,
          #160044 100%
        );

      filter: blur(25px);
      opacity: 0.95;

      animation:
        moltenMove 14s ease-in-out infinite alternate,
        moltenRotate 22s linear infinite;

      transform-origin: center;
    }

    .blob.one {
      left: -15%;
      top: -20%;
    }

    .blob.two {
      right: -20%;
      bottom: -25%;

      width: 70vw;
      height: 70vw;

      animation-duration: 17s, 27s;
      animation-delay: -5s, -10s;
    }

    .blob.three {
      left: 30%;
      top: 25%;

      width: 40vw;
      height: 40vw;

      opacity: 0.5;
      filter: blur(45px);

      animation-duration: 20s, 30s;
    }

    /* ==============================
       BLOB ANIMATIONS
    ============================== */

    @keyframes moltenMove {
      0% {
        transform: translate3d(-5%, -3%, 0) scale(1);
      }

      50% {
        transform: translate3d(8%, 7%, 0) scale(1.12);
      }

      100% {
        transform: translate3d(-3%, 10%, 0) scale(0.95);
      }
    }

    @keyframes moltenRotate {
      from {
        rotate: 0deg;
      }

      to {
        rotate: 360deg;
      }
    }

    /* ==============================
       GRAIN / NOISE
    ============================== */

    .grain {
      position: fixed;
      inset: -50%;

      pointer-events: none;

      opacity: 0.07;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");

      animation: grainMove 0.25s steps(2) infinite;
    }

    @keyframes grainMove {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(3%, -2%);
      }

      50% {
        transform: translate(-2%, 3%);
      }

      75% {
        transform: translate(2%, 2%);
      }

      100% {
        transform: translate(-3%, -3%);
      }
    }

    /* ==============================
       DARK OVERLAY
    ============================== */

    .overlay {
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          transparent 20%,
          rgba(0, 0, 0, 0.25) 100%
        );
    }

    /* ==============================
       LOGIN CONTAINER
    ============================== */

    .container {
      position: relative;
      z-index: 10;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    /* ==============================
       LOGIN CARD
    ============================== */

    .login-box {
      width: 100%;
      max-width: 420px;

      padding: 45px 40px;

      text-align: center;
      color: white;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.13);

      border: 1px solid rgba(255, 255, 255, 0.25);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    /* ==============================
       LOGO
    ============================== */

    .logo {
      font-size: 52px;
      margin-bottom: 15px;
    }

    /* ==============================
       TITLE
    ============================== */

    h1 {
      margin-bottom: 10px;

      font-size: 34px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-bottom: 30px;

      font-size: 16px;
      opacity: 0.85;
    }

    /* ==============================
       PASSWORD INPUT
    ============================== */

    input {
      width: 100%;

      padding: 15px 18px;
      margin-bottom: 15px;

      font-size: 16px;
      color: white;

      outline: none;

      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);

      background: rgba(255, 255, 255, 0.12);

      transition: 0.25s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.18);
    }

    /* ==============================
       BUTTON
    ============================== */

    button {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: 12px;

      background: white;
      color: #5227ff;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.25);
    }

    /* ==============================
       ERROR MESSAGE
    ============================== */

    .error {
      display: none;

      margin-top: 15px;

      color: #ffd6fa;

      font-size: 14px;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

      .login-box {
        padding: 35px 25px;
      }

      h1 {
        font-size: 28px;
      }

      .logo {
        font-size: 45px;
      }
    }
  </style>

</head>

<body>

  <!-- ==============================
       BACKGROUND
  ============================== -->

  <div class="background">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>

  <!-- Grain effect -->

  <div class="grain"></div>

  <!-- Dark overlay -->

  <div class="overlay"></div>

  <!-- ==============================
       LOGIN
  ============================== -->

  <main class="container">

```
<div class="login-box">

  <!-- Logo -->
  <div class="logo">🇬🇧</div>

  <!-- Title -->
  <h1>English Courses</h1>

  <!-- Subtitle -->
  <p class="subtitle">
    Your online learning space
  </p>

  <!-- Password -->
  <input
    type="password"
    id="password"
    placeholder="Enter your class password"
    autocomplete="off"
  >

  <!-- Access button -->
  <button onclick="checkPassword()">
    Access my courses →
  </button>

  <!-- Error -->
  <p id="error" class="error">
    Incorrect password. Please try again.
  </p>

</div>
```

  </main>

  <!-- ==============================
       JAVASCRIPT
  ============================== -->

  <script>

    /*
     * ==============================
     * PASSWORD
     * ==============================
     *
     * Change the password here.
     */

    const correctPassword = "ENGLISH2026";


    /*
     * ==============================
     * CHECK PASSWORD
     * ==============================
     */

    function checkPassword() {

      const passwordInput =
        document.getElementById("password");

      const errorMessage =
        document.getElementById("error");

      const password =
        passwordInput.value;


      if (password === correctPassword) {

        // Go to the classes page
        window.location.href = "classes.html";

      } else {

        // Show error
        errorMessage.style.display = "block";

        // Clear password
        passwordInput.value = "";

        // Put cursor back in input
        passwordInput.focus();
      }
    }


    /*
     * ==============================
     * ENTER KEY
     * ==============================
     */

    document
      .getElementById("password")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

      });


    /*
     * ==============================
     * MOUSE INTERACTION
     * ==============================
     */

    document.addEventListener("mousemove", function(event) {

      const x =
        (event.clientX / window.innerWidth - 0.5) * 20;

      const y =
        (event.clientY / window.innerHeight - 0.5) * 20;


      document.querySelector(".blob.one").style.transform =
        `translate(${x}px, ${y}px)`;

    });

  </script>

</body>
</html>
